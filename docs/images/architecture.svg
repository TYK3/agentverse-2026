<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="1100" height="470" rx="18" fill="#ffffff"/>
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">AFTERSHOCK: perceive → decide → check → act, on one topic bus</text>

  <!-- main loop row -->
  <g font-size="14" text-anchor="middle">
    <rect x="30" y="80" width="170" height="96" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="115" y="108" font-weight="700" fill="#0c4a6e">sim/</text>
    <text x="115" y="130" fill="#0c4a6e">MuJoCo world, Scout</text>
    <text x="115" y="148" fill="#0c4a6e">LiDAR · depth · thermal</text>
    <text x="115" y="166" fill="#0c4a6e">acoustic · 10 Hz</text>

    <rect x="240" y="80" width="190" height="96" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="335" y="108" font-weight="700" fill="#14532d">perception/</text>
    <text x="335" y="130" fill="#14532d">map: seen / inferred /</text>
    <text x="335" y="148" fill="#14532d">unknown · casualties</text>
    <text x="335" y="166" fill="#14532d">(no faces) · hazards · 2 Hz</text>

    <rect x="470" y="80" width="190" height="96" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="565" y="108" font-weight="700" fill="#78350f">planner/</text>
    <text x="565" y="130" fill="#78350f">local A* over seen cells</text>
    <text x="565" y="148" fill="#78350f">confidence gate:</text>
    <text x="565" y="166" fill="#78350f">act · re-look · refer</text>

    <rect x="700" y="80" width="170" height="96" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="785" y="108" font-weight="700" fill="#0c4a6e">physics check</text>
    <text x="785" y="130" fill="#0c4a6e">MuJoCo shakes the</text>
    <text x="785" y="148" fill="#0c4a6e">route; a moving block</text>
    <text x="785" y="166" fill="#0c4a6e">rejects it</text>

    <rect x="910" y="80" width="160" height="96" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="990" y="108" font-weight="700" fill="#0f172a">move permit</text>
    <text x="990" y="130" fill="#0f172a">granted only after</text>
    <text x="990" y="148" fill="#0f172a">physics + human gate</text>
    <text x="990" y="166" fill="#0f172a">if risky</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M200 128 H236"/>
    <path d="M430 128 H466"/>
    <path d="M660 128 H696"/>
    <path d="M870 128 H906"/>
  </g>

  <!-- responder row -->
  <g font-size="14" text-anchor="middle">
    <rect x="860" y="230" width="210" height="80" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="965" y="258" font-weight="700" fill="#3b0764">Responder acts</text>
    <text x="965" y="280" fill="#3b0764">drive · clear light rubble</text>
    <text x="965" y="298" fill="#3b0764">place water / kit / radio</text>
  </g>
  <path d="M990 176 V226" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- adaptation loop -->
  <path d="M860 272 H115 V182" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#r)"/>
  <text x="490" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">aftershock or moved debris: LiDAR scan diff revokes the permit,</text>
  <text x="490" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Responder stops, Scout re-scans, a new route is verified and explained</text>

  <!-- side lanes -->
  <g font-size="14" text-anchor="middle">
    <rect x="30" y="360" width="330" height="84" rx="12" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
    <text x="195" y="388" font-weight="700" fill="#831843">console/ (browser)</text>
    <text x="195" y="410" fill="#831843">3D map, routes, reasoning, budget meter</text>
    <text x="195" y="428" fill="#831843">approve / reject, typed commands, report</text>

    <rect x="385" y="360" width="330" height="84" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
    <text x="550" y="388" font-weight="700" fill="#7c2d12">voice/</text>
    <text x="550" y="410" fill="#7c2d12">operator voice, casualty translation,</text>
    <text x="550" y="428" fill="#7c2d12">cited first-aid steps, call prep</text>

    <rect x="740" y="360" width="330" height="84" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="905" y="388" font-weight="700" fill="#334155">Gemini (cloud, optional, advisory)</text>
    <text x="905" y="410" fill="#334155">never grants movement · receipts logged</text>
    <text x="905" y="428" fill="#334155">offline: Gemma 4 E2B on the device</text>
  </g>
  <text x="550" y="462" text-anchor="middle" font-size="12" fill="#64748b">All lanes talk only through typed topics on coord/hub.py (FastAPI + WebSocket /ws). The browser may write only operator/command and gate/answer.</text>
</svg>
